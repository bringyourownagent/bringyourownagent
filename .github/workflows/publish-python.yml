# Publishes sdk/python to PyPI when a tag like python-v0.0.1 is pushed.
# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere.
# PyPI side: project "bringyourownagent", publisher = this repository, workflow publish-python.yml, environment "pypi".
name: Publish Python package

on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: sdk/python
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Check the tag matches the package version
        working-directory: sdk/python
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import bringyourownagent; print(bringyourownagent.__version__)")
          test "python-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Build wheel and sdist
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: sdk/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
