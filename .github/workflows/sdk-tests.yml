name: SDK tests

on:
  push:
    paths: ["sdk/**", "spec/**", ".github/workflows/sdk-tests.yml"]
  pull_request:
    paths: ["sdk/**", "spec/**", ".github/workflows/sdk-tests.yml"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Shared vectors and unit tests
        working-directory: sdk/python
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Shared vectors and unit tests
        working-directory: sdk/js
        run: node --test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        working-directory: sdk/dotnet
        run: dotnet build tests/BringYourOwnAgent.Tests -c Release
      - name: Shared vectors and unit tests (net8.0 build)
        working-directory: sdk/dotnet
        run: dotnet run --project tests/BringYourOwnAgent.Tests -c Release -f net8.0 --no-build
      - name: Shared vectors and unit tests (netstandard2.0 build)
        working-directory: sdk/dotnet
        run: dotnet run --project tests/BringYourOwnAgent.Tests -c Release -f net8.0 -p:TestNetStandard=true

  dotnet-framework:
    # The netstandard2.0 build on .NET Framework 4.8, as Windows desktop apps load it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Shared vectors and unit tests (.NET Framework 4.8)
        working-directory: sdk/dotnet
        run: dotnet run --project tests/BringYourOwnAgent.Tests -c Release -f net48
