# /etc/apache2/sites-available/001-wallet.bringyourownagent.org.conf (enabled with a link in sites-enabled; a copy lives here in the repository)
# "Agent wallet (web)": static files, nothing else, no cookies, no proxy. It has its own origin because the visitor's OpenRouter key sits in the
# storage of this origin: another page on the same origin could read it, so this host serves only the wallet.
# The file name starts with 001- so that this :80 host is matched before the apex site's wildcard alias (*.bringyourownagent.org), which would
# otherwise send this name to the apex. Certificate: Let's Encrypt for this one name, HTTP-01 through the apex site's acme folder
# (/var/www/bringyourownagent.org/acme, served for every name by the apex :80 host), renewed by the certbot timer.
# Files: /var/www/wallet.bringyourownagent.org/site  (index.html, style.css, src/, vendor/ of the webwallet folder; not test/).
# After a change:  sudo apache2ctl configtest && sudo systemctl reload apache2   (reload, not restart: other sites live there)
<VirtualHost *:80>
    ServerName wallet.bringyourownagent.org
    DocumentRoot /var/www/bringyourownagent.org/acme

    <Directory /var/www/bringyourownagent.org/acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://wallet.bringyourownagent.org%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName wallet.bringyourownagent.org
    DocumentRoot /var/www/wallet.bringyourownagent.org/site

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/wallet.bringyourownagent.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wallet.bringyourownagent.org/privkey.pem

    <Directory /var/www/wallet.bringyourownagent.org/site>
        Options None
        AllowOverride None
        Require all granted
        <LimitExcept GET HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>

    DirectoryIndex index.html

    # The same policy as the page's own <meta> plus what a meta cannot carry (framing). Nothing is allowed by default; scripts and styles only from
    # this origin; the network only to OpenRouter and to a site's wss:// endpoint. These replace the global ones of conf-enabled/security.conf.
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://openrouter.ai wss:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Strict-Transport-Security "max-age=31536000"
    # Small files that change with a release: the browser asks again every time (a changed file is a 304 at most).
    Header always set Cache-Control "no-cache"

    ErrorLog ${APACHE_LOG_DIR}/wallet.bringyourownagent.org-error.log
    CustomLog ${APACHE_LOG_DIR}/wallet.bringyourownagent.org-access.log combined
</VirtualHost>
